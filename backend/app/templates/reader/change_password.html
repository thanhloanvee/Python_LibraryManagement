{% extends "base.html" %}
{% block title %}Đổi mật khẩu{% endblock %}

{% block breadcrumb %}
<nav class="flex items-center gap-2 text-sm text-gray-500">
  <a href="/reader/profile" class="hover:text-gray-700">Hồ sơ</a>
  <span>/</span>
  <span class="text-gray-900 font-medium">Đổi mật khẩu</span>
</nav>
{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="rounded-2xl bg-white border border-gray-100 shadow-sm p-6 sm:p-8">
    <h2 class="text-xl font-bold text-gray-900 mb-6">Đổi mật khẩu</h2>

    {% if error %}
    <div class="mb-5 rounded-lg bg-red-50 border border-red-200 p-3 text-sm text-red-800">{{ error }}</div>
    {% endif %}

    <form method="post" action="/reader/change-password" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu hiện tại <span class="text-red-500">*</span></label>
        <input name="old_password" type="password" required autocomplete="current-password"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-200 focus:outline-none transition" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu mới <span class="text-red-500">*</span></label>
        <input name="new_password" type="password" required minlength="8" autocomplete="new-password"
          class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm focus:border-brand-500 focus:ring-2 focus:ring-brand-200 focus:outline-none transition" />
        <p class="mt-1 text-xs text-gray-400">Tối thiểu 8 ký tự.</p>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="submit"
          class="inline-flex items-center gap-2 rounded-lg bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 transition">
          Cập nhật mật khẩu
        </button>
        <a href="/reader/profile"
          class="inline-flex items-center rounded-lg border border-gray-300 px-5 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
          Hủy
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
