<!-- Reusable book card (included by site/index.html and books/index.html) -->
<a href="/books/{{ book.id }}"
  class="group flex flex-col rounded-xl bg-white border border-gray-100 shadow-sm hover:shadow-md hover:border-brand-200 transition-all overflow-hidden">

  <!-- Cover image -->
  <div class="aspect-[3/4] bg-gray-100 overflow-hidden relative">
    {% if book.cover_image %}
    <img src="/{{ book.cover_image }}" alt="{{ book.title }}"
      class="h-full w-full object-cover group-hover:scale-105 transition-transform duration-300" />
    {% else %}
    <div class="flex h-full w-full items-center justify-center">
      <svg class="h-16 w-16 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1"
          d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
    </div>
    {% endif %}

    <!-- Available badge -->
    {% if book.is_available %}
    <span class="absolute top-2 right-2 rounded-full bg-green-500 px-2 py-0.5 text-xs font-medium text-white shadow">
      Có sẵn
    </span>
    {% else %}
    <span class="absolute top-2 right-2 rounded-full bg-gray-400 px-2 py-0.5 text-xs font-medium text-white shadow">
      Không có sẵn
    </span>
    {% endif %}
  </div>

  <!-- Info -->
  <div class="flex flex-1 flex-col p-4">
    <h4 class="font-semibold text-gray-900 text-sm leading-snug line-clamp-2 group-hover:text-brand-700 transition-colors">
      {{ book.title }}
    </h4>
    <p class="mt-1 text-xs text-gray-500 truncate">{{ book.author }}</p>
    {% if book.category %}
    <span class="mt-auto pt-3 inline-block text-xs font-medium text-brand-600 bg-brand-50 rounded-full px-2 py-0.5 w-fit">
      {{ book.category.name }}
    </span>
    {% endif %}
  </div>
</a>
