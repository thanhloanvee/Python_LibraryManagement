{% if flash %}
{% set cat = flash.cat %}
<div id="flash-message"
  x-data="{ show: true }"
  x-init="setTimeout(() => show = false, 5000)"
  x-show="show"
  x-transition:leave="transition ease-in duration-300"
  x-transition:leave-start="opacity-100 translate-y-0"
  x-transition:leave-end="opacity-0 -translate-y-2"
  class="mx-4 mt-4 sm:mx-6 lg:mx-8 rounded-xl px-4 py-3 text-sm flex items-start gap-3 shadow
    {% if cat == 'success' %}bg-green-50 border border-green-200 text-green-800
    {% elif cat == 'error' %}bg-red-50 border border-red-200 text-red-800
    {% elif cat == 'warning' %}bg-amber-50 border border-amber-200 text-amber-800
    {% else %}bg-blue-50 border border-blue-200 text-blue-800{% endif %}"
  role="alert"
>
  <!-- Icon -->
  {% if cat == 'success' %}
  <svg class="h-5 w-5 shrink-0 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>
  {% elif cat == 'error' %}
  <svg class="h-5 w-5 shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>
  {% else %}
  <svg class="h-5 w-5 shrink-0 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
  </svg>
  {% endif %}

  <span class="flex-1">{{ flash.msg }}</span>

  <button @click="show = false" class="shrink-0 opacity-60 hover:opacity-100">
    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
    </svg>
  </button>
</div>
{% endif %}
