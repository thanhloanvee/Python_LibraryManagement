<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{% endblock %} — LMS</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253'/></svg>" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#eff6ff', 100:'#dbeafe', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a8a' }
          }
        }
      }
    }
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="h-full bg-gradient-to-br from-brand-900 via-brand-800 to-brand-700 flex items-center justify-center px-4">

  <div class="w-full max-w-md">
    <!-- Logo card -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-white/10 backdrop-blur mb-4 hover:bg-white/20 transition-colors">
        <svg class="h-9 w-9 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.746 0 3.332.477 4.5 1.253v13C19.832 18.477 18.246 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
        </svg>
      </a>
      <h1 class="text-2xl font-bold text-white">Quản lý Thư viện</h1>
      <p class="text-brand-200 text-sm mt-1">{% block subtitle %}{% endblock %}</p>
    </div>

    <!-- Main card -->
    <div class="bg-white rounded-2xl shadow-2xl p-8">
      {% if flash %}
        {% set cat = flash.cat %}
        <div class="mb-4 rounded-lg p-3 text-sm
          {% if cat == 'success' %}bg-green-50 text-green-800 border border-green-200
          {% elif cat == 'error' %}bg-red-50 text-red-800 border border-red-200
          {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}">
          {{ flash.msg }}
        </div>
      {% endif %}

      {% block content %}{% endblock %}
    </div>
  </div>

</body>
</html>
