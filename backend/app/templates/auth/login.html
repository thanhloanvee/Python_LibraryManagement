{% extends "auth/base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block subtitle %}Đăng nhập vào tài khoản{% endblock %}

{% block content %}
<h2 class="text-xl font-bold text-gray-900 mb-6">Chào mừng quay lại</h2>

{% if error %}
<div class="mb-4 rounded-lg bg-red-50 border border-red-200 p-3 text-sm text-red-800">
  {{ error }}
</div>
{% endif %}

<form method="post" action="/login" class="space-y-4">
  <input type="hidden" name="next" value="{{ next }}" />

  <div>
    <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Tên đăng nhập</label>
    <input id="username" name="username" type="text" autocomplete="username" required
      class="w-full rounded-lg border border-gray-300 px-3 py-2 text-sm shadow-sm
             placeholder-gray-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 focus:outline-none transition"
      placeholder="Nhập tên đăng nhập" />
  </div>

  <div>
    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu</label>
    <div class="relative" x-data="{ show: false }">
      <input id="password" name="password" :type="show ? 'text' : 'password'"
        autocomplete="current-password" required
        class="w-full rounded-lg border border-gray-300 px-3 py-2 pr-10 text-sm shadow-sm
               placeholder-gray-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-200 focus:outline-none transition"
        placeholder="Nhập mật khẩu" />
      <button type="button" @click="show = !show"
        class="absolute inset-y-0 right-3 flex items-center text-gray-400 hover:text-gray-600">
        <svg x-show="!show" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7
               -1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        </svg>
        <svg x-show="show" x-cloak class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7
               a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242
               M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5
               c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
        </svg>
      </button>
    </div>
  </div>

  <button type="submit"
    class="w-full rounded-lg bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white
           hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 transition">
    Đăng nhập
  </button>
</form>

<p class="mt-6 text-center text-sm text-gray-500">
  Chưa có tài khoản?
  <a href="/register" class="font-medium text-brand-600 hover:text-brand-700">Đăng ký</a>
</p>

<div class="mt-6 border-t border-gray-100 pt-5">
  <p class="mb-2 text-center text-xs font-medium text-gray-400 uppercase tracking-wide">Demo</p>
  <div class="flex gap-2">
    <button type="button" onclick="fillLogin('admin','Admin@123456')"
      class="flex-1 rounded-lg border border-gray-200 bg-gray-50 px-2 py-2 text-center text-xs font-medium text-gray-700 hover:bg-brand-50 hover:border-brand-300 hover:text-brand-700 transition">
      <span class="block font-semibold">Admin</span>
      <span class="text-gray-400">admin</span>
    </button>
    <button type="button" onclick="fillLogin('librarian1','Lib@123456')"
      class="flex-1 rounded-lg border border-gray-200 bg-gray-50 px-2 py-2 text-center text-xs font-medium text-gray-700 hover:bg-brand-50 hover:border-brand-300 hover:text-brand-700 transition">
      <span class="block font-semibold">Thủ thư</span>
      <span class="text-gray-400">librarian1</span>
    </button>
    <button type="button" onclick="fillLogin('phamthisam','Reader@123')"
      class="flex-1 rounded-lg border border-gray-200 bg-gray-50 px-2 py-2 text-center text-xs font-medium text-gray-700 hover:bg-brand-50 hover:border-brand-300 hover:text-brand-700 transition">
      <span class="block font-semibold">Độc giả</span>
      <span class="text-gray-400">phamthisam</span>
    </button>
  </div>
</div>

<script>
function fillLogin(username, password) {
  document.getElementById('username').value = username;
  document.getElementById('password').value = password;
  document.getElementById('username').focus();
}
</script>
{% endblock %}
