{% extends "base.html" %}
{% block title %}Dashboard — LibraryMS{% endblock %}

{% block content %}
<h1>Dashboard</h1>
<p id="welcomeMsg" class="subtitle"></p>

<div class="stats-grid" id="statsGrid">
  <div class="stat-card">
    <div class="stat-number" id="statBooks">—</div>
    <div class="stat-label">Total Books</div>
  </div>
  <div class="stat-card">
    <div class="stat-number" id="statBorrows">—</div>
    <div class="stat-label">Total Borrows</div>
  </div>
  <div class="stat-card">
    <div class="stat-number" id="statOverdue">—</div>
    <div class="stat-label">Overdue</div>
  </div>
  <div class="stat-card">
    <div class="stat-number" id="statUsers">—</div>
    <div class="stat-label">Users</div>
  </div>
</div>

<section class="section">
  <h2>Most Borrowed Books</h2>
  <table class="table" id="popularTable">
    <thead>
      <tr><th>#</th><th>Title</th><th>Author</th><th>Times Borrowed</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</section>
{% endblock %}

{% block scripts %}
<script>
const token = localStorage.getItem('access_token');
if (!token) window.location.href = '/login';

const user = JSON.parse(localStorage.getItem('user') || '{}');
document.getElementById('welcomeMsg').textContent =
  `Welcome, ${user.username || 'guest'} (${user.role || ''})`;

async function apiFetch(url) {
  const res = await fetch(url, {
    headers: { 'Authorization': `Bearer ${token}` }
  });
  if (res.status === 401) { window.location.href = '/login'; }
  return res.json();
}

(async () => {
  if (user.role === 'admin') {
    const s = await apiFetch('/api/reports/summary');
    if (s.success) {
      document.getElementById('statBooks').textContent   = s.data.total_books;
      document.getElementById('statBorrows').textContent = s.data.total_borrow_records;
      document.getElementById('statOverdue').textContent = s.data.overdue_borrows;
      document.getElementById('statUsers').textContent   = s.data.total_users;
    }
    const p = await apiFetch('/api/reports/popular?limit=5');
    if (p.success) {
      const tbody = document.querySelector('#popularTable tbody');
      p.data.forEach((b, i) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${i+1}</td><td>${b.title}</td><td>${b.author}</td><td>${b.borrow_count}</td>`;
        tbody.appendChild(tr);
      });
    }
  } else {
    document.getElementById('statsGrid').style.display = 'none';
  }
})();
</script>
{% endblock %}
