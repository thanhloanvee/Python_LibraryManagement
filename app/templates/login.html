{% extends "base.html" %}
{% block title %}Login — LibraryMS{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Sign In</h1>
  <p class="subtitle">Welcome back! Please enter your credentials.</p>

  <div id="alertBox" class="alert" style="display:none;"></div>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required />
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="••••••••" required />
    </div>
    <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
      Sign In
    </button>
  </form>

  <p class="auth-footer">
    Don't have an account?
    <a href="#" id="showRegister">Register here</a>
  </p>

  <!-- Register form (hidden by default) -->
  <form id="registerForm" style="display:none;" novalidate>
    <h2>Create Account</h2>
    <div class="form-group">
      <label for="regUsername">Username</label>
      <input type="text" id="regUsername" placeholder="john_doe" required />
    </div>
    <div class="form-group">
      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="you@example.com" required />
    </div>
    <div class="form-group">
      <label for="regPassword">Password (min 8 chars)</label>
      <input type="password" id="regPassword" placeholder="••••••••" required />
    </div>
    <button type="submit" class="btn btn-secondary btn-block">Register</button>
    <p class="auth-footer"><a href="#" id="showLogin">Back to login</a></p>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
const API = '/api';

function showAlert(msg, type = 'error') {
  const box = document.getElementById('alertBox');
  box.textContent = msg;
  box.className = `alert alert-${type}`;
  box.style.display = 'block';
}

// Toggle between login / register
document.getElementById('showRegister').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('registerForm').style.display = 'block';
});
document.getElementById('showLogin').addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('registerForm').style.display = 'none';
  document.getElementById('loginForm').style.display = 'block';
});

// Login
document.getElementById('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  try {
    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('access_token', data.data.access_token);
      localStorage.setItem('refresh_token', data.data.refresh_token);
      localStorage.setItem('user', JSON.stringify(data.data.user));
      window.location.href = '/';
    } else {
      showAlert(data.message || 'Login failed.');
    }
  } catch {
    showAlert('Network error. Please try again.');
  }
});

// Register
document.getElementById('registerForm').addEventListener('submit', async e => {
  e.preventDefault();
  const username = document.getElementById('regUsername').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  try {
    const res = await fetch(`${API}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('access_token', data.data.access_token);
      localStorage.setItem('refresh_token', data.data.refresh_token);
      localStorage.setItem('user', JSON.stringify(data.data.user));
      window.location.href = '/';
    } else {
      showAlert(data.message || 'Registration failed.');
    }
  } catch {
    showAlert('Network error. Please try again.');
  }
});
</script>
{% endblock %}
